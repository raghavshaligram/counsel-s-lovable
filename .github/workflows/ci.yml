name: CI

# The automated safety net for the redaction guarantee: every push and PR to
# main must pass BOTH the Node unit suite (vitest — includes the redaction-gate
# regression test) AND the real-browser Playwright e2e suite (drives the actual
# rasterize → sanitize → verify worker chain against a live dev server).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A newer commit on the same ref supersedes older in-flight runs.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Unit tests (vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # onnxruntime-node (pulled transitively via @huggingface/transformers)
      # downloads a native binary in its postinstall that neither the unit
      # suite nor the browser bundle needs — the app runs onnxruntime-web in
      # the browser. Skipping lifecycle scripts keeps installs deterministic
      # and avoids that flaky binary fetch; esbuild/rollup ship their platform
      # binaries as optional dependencies (no postinstall), so the toolchain
      # still works.
      - name: Install dependencies
        run: npm install --no-audit --no-fund --ignore-scripts

      - name: Run unit tests
        run: npm test

  e2e:
    name: E2E tests (playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund --ignore-scripts

      # Installs the Chromium build matched to the pinned @playwright/test
      # version, plus its OS-level dependencies.
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      # playwright.config.ts intentionally does NOT declare a `webServer`, so
      # we bring the dev server up ourselves. Bind explicitly to IPv4 so the
      # baseURL (http://localhost:8080) resolves regardless of the runner's
      # IPv6 configuration. The background process persists across steps for
      # the lifetime of the job.
      - name: Start dev server
        run: |
          npm run dev -- --host 127.0.0.1 --port 8080 --strictPort > /tmp/vite-dev.log 2>&1 &
          echo "started dev server (pid $!)"

      - name: Wait for dev server
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:8080/ >/dev/null 2>&1; then
              echo "dev server is up"
              exit 0
            fi
            sleep 2
          done
          echo "::error::dev server did not become ready within 120s"
          cat /tmp/vite-dev.log || true
          exit 1

      - name: Run e2e tests
        run: npx playwright test

      - name: Dump dev server log on failure
        if: failure()
        run: cat /tmp/vite-dev.log || true

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore
