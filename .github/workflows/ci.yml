name: CI

# The automated safety net for the redaction guarantee: every push and PR to
# main must pass BOTH the Node unit suite (vitest — includes the redaction-gate
# regression test) AND the real-browser Playwright e2e suite (drives the actual
# rasterize → sanitize → verify worker chain against a live dev server).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A newer commit on the same ref supersedes older in-flight runs.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Unit tests (vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Use `npm install`, not `npm ci`: this repo is Lovable-managed, and
      # Lovable bumps versions in package.json without regenerating
      # package-lock.json, so `npm ci`'s strict lock-sync check fails
      # (EUSAGE). `npm install` reconciles the drift instead of erroring.
      # --ignore-scripts skips onnxruntime-node's native-binary postinstall
      # (pulled transitively via @huggingface/transformers) — neither the
      # unit suite nor the browser bundle needs it (the app runs
      # onnxruntime-web). esbuild/rollup/sharp ship platform binaries as
      # optional dependencies (no postinstall), so the toolchain still works.
      - name: Install dependencies
        run: npm install --no-audit --no-fund --ignore-scripts

      - name: Run unit tests
        run: npm test

  e2e:
    name: E2E tests (playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund --ignore-scripts

      # Installs the Chromium build matched to the pinned @playwright/test
      # version, plus its OS-level dependencies.
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      # Build the standalone e2e harness page (a production build) and serve it
      # with `vite preview` — NOT the app dev server. The dev server's HMR
      # client and on-the-fly dependency optimization issued spurious full-page
      # reloads mid-run, and pdf.js fell back to a "fake worker" on a 404, which
      # tore down / stalled the redaction chain ("Execution context was
      # destroyed, most likely because of a navigation"). A static preview has
      # no HMR, no dev transforms, and bundles pdf.js's worker as a real asset —
      # deterministic and closer to what ships. See vite.e2e.config.ts.
      - name: Build e2e harness
        run: npx vite build --config vite.e2e.config.ts

      # The preview server binds 127.0.0.1:8080 (strictPort) via the config.
      # The background process persists across steps for the job's lifetime.
      - name: Start preview server
        run: |
          npx vite preview --config vite.e2e.config.ts > /tmp/vite-preview.log 2>&1 &
          echo "started preview server (pid $!)"

      - name: Wait for preview server
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:8080/ >/dev/null 2>&1; then
              echo "preview server is up"
              exit 0
            fi
            sleep 2
          done
          echo "::error::preview server did not become ready within 120s"
          cat /tmp/vite-preview.log || true
          exit 1

      - name: Run e2e tests
        run: npx playwright test

      - name: Dump preview server log on failure
        if: failure()
        run: cat /tmp/vite-preview.log || true

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore
